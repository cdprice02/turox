[workspace]
resolver = "2"
members = ["turox-cli", "turox-engine", "turox-macros"]

[workspace.dependencies]
proptest = "1.5"
criterion = "0.8"

[workspace.lints.rust]
missing_docs = "deny"
# The crate has none today. Magic bitboards are exactly where `get_unchecked`
# creeps in during a perf pass; this makes that a deliberate, reviewed
# exception (via #[allow(unsafe_code)]) rather than a quiet one.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
string_slice = "deny"
as_conversions = "deny"
unreachable = "deny"
unwrap_used = "deny"
# The other half of the `unwrap_used` policy, which was only ever half applied:
# with `unwrap` denied and `expect` not, `expect` was the unaudited escape
# hatch. Denied here so each surviving site has to *say* why it cannot fail,
# via `#[expect(clippy::expect_used, reason = "...")]`, rather than rewriting
# infallible math and table lookups into `Result`s that lie about what can
# happen. Same reasoning that keeps `indexing_slicing` and
# `arithmetic_side_effects` off entirely (see `docs/agents/toolchain.md`):
# this is engine code where those operations are the normal mode, and the goal
# is an auditable justification, not a uniformly defensive style.
# `clippy.toml` already exempts test code.
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
dbg_macro = "deny"
missing_assert_message = "deny"
wildcard_enum_match_arm = "deny"
allow_attributes_without_reason = "deny"
# `#[expect]` over `#[allow]`, everywhere. The difference is that an `#[expect]`
# fails the build once the lint it suppresses *stops* firing, so a suppression
# that has outlived its reason reports itself instead of waiting for someone to
# audit for it. Two in this crate are already on a timer: the `dead_code` on
# `MovePriority`'s unused variants expires when principal variation search and
# mate killers land, and `perft_divide`'s expires when something calls it.
allow_attributes = "deny"

[profile.release]
lto = "fat"
codegen-units = 1

# Newtypes like Bitboard don't inline at opt-level 0, so unoptimized debug builds are
# painfully slow for perft/proptest runs. Bump the default dev profile...
[profile.dev]
opt-level = 1

# ...and fully optimize dependencies regardless, since we're not debugging into them.
[profile.dev.package."*"]
opt-level = 3

[profile.bench]
debug = true

[profile.samply]
inherits = "release"
debug = true
