[workspace]
resolver = "2"
members = ["turox-cli", "turox-engine"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5.37", features = ["derive"] }
proptest = "1.5"
criterion = "0.8"

# turox-engine takes zero runtime dependencies (see turox-engine/Cargo.toml). Keep
# anyhow scoped to turox-cli: a library returning anyhow::Error denies callers the
# ability to match on failure, so it belongs at the binary boundary, not in the engine.

[workspace.lints.rust]
missing_docs = "deny"
# The crate has none today. Magic bitboards are exactly where `get_unchecked`
# creeps in during a perf pass; this makes that a deliberate, reviewed
# exception (via #[allow(unsafe_code)]) rather than a quiet one.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"

# Deferred, not dropped: each of these needs a dedicated, per-call-site pass
# over hot-path bitboard/search code (magic generation, board internals,
# negamax) to resolve correctly, either a checked/wrapping rewrite or a
# reviewed #[allow] with justification like the existing unsafe_code
# exceptions, not a blanket decision made alongside the mechanical
# pedantic/nursery cleanup that enabled everything above.
# unwrap_used = "deny"
# expect_used = "deny"
# indexing_slicing = "deny"
# arithmetic_side_effects = "deny"
# unreachable = "deny"
# string_slice = "deny"
# as_conversions = "deny"
# Also part of `pedantic`, allowed back individually for the same reason
# (same-width/narrowing casts are exactly where this shows up in bitboard
# index and square-delta arithmetic):
cast_possible_wrap = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

[profile.release]
lto = "fat"
codegen-units = 1

# Newtypes like Bitboard don't inline at opt-level 0, so unoptimized debug builds are
# painfully slow for perft/proptest runs. Bump the default dev profile...
[profile.dev]
opt-level = 1

# ...and fully optimize dependencies regardless, since we're not debugging into them.
[profile.dev.package."*"]
opt-level = 3

[profile.bench]
debug = true
