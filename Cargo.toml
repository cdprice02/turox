[workspace]
resolver = "2"
members = ["turox-cli", "turox-engine", "turox-macros"]

[workspace.dependencies]
proptest = "1.5"
criterion = "0.8"

[workspace.lints.rust]
missing_docs = "deny"
# The crate has none today. Magic bitboards are exactly where `get_unchecked`
# creeps in during a perf pass; this makes that a deliberate, reviewed
# exception (via #[allow(unsafe_code)]) rather than a quiet one.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
string_slice = "deny"
as_conversions = "deny"
unreachable = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
dbg_macro = "deny"
missing_assert_message = "deny"
wildcard_enum_match_arm = "deny"
allow_attributes_without_reason = "deny"

# `indexing_slicing` and `arithmetic_side_effects` are deliberately not enabled:
# this is bitboard/table-driven engine code, so indexing and arithmetic are the
# normal way to write it, not the exception. Denying them would mean an
# `#[allow]` (or an unwanted checked/wrapping rewrite) on most lines that touch
# a board, not a reviewed exception on a few, which defeats the point of a
# restriction lint.

[profile.release]
lto = "fat"
codegen-units = 1

# Newtypes like Bitboard don't inline at opt-level 0, so unoptimized debug builds are
# painfully slow for perft/proptest runs. Bump the default dev profile...
[profile.dev]
opt-level = 1

# ...and fully optimize dependencies regardless, since we're not debugging into them.
[profile.dev.package."*"]
opt-level = 3

[profile.bench]
debug = true
