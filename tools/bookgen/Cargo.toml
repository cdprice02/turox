[package]
name = "bookgen"
version = "0.1.0"
edition = "2021"
publish = false
# Matches turox-engine's floor (see its Cargo.toml), which this depends on.
rust-version = "1.87"

# A workspace member, unlike turox-fuzz: every `--workspace` command reaches
# it, so its tests run, its lints are the same ones the engine answers to, and
# nothing here needs a second entry in CI to be checked at all. turox-fuzz
# stays out because it needs a different toolchain; this only ever needed a
# different dependency list, which is what the `fetch` feature below is for.
[lints]
workspace = true

[dependencies]
clap = { version = "4.5.37", features = ["derive"] }
turox-chess = { path = "../../turox-chess" }
turox-notation = { path = "../../turox-notation" }
# Optional for the same reason `ureq` is, and gated behind the same feature:
# only `generate-openings` needs it, for one constant (`eval`'s piece values,
# reused rather than transcribed). A default build of this crate therefore
# compiles the rules of chess and the notation parser, and no search at all.
turox-engine = { path = "../../turox-engine", optional = true }
# Optional, and gated behind `fetch`, because it is the whole TLS and HTTP
# stack: rustls, ring and around two dozen crates behind them. Cargo pins an
# optional dependency in the lock whether or not the feature is on, so this
# does not keep them out of `Cargo.lock`; what it avoids is *compiling* them.
# Only `src/bin/generate-openings.rs` needs any of it, and only when
# regenerating the opening suite, so a default workspace build builds none of
# it (verified: zero ring/rustls/ureq artifacts after `cargo build
# --workspace`). The default rustls/webpki-roots features avoid a system OpenSSL
# dependency, which matters more here than usual since this tool runs across
# the several machines noted in the top-level CLAUDE.md.
ureq = { version = "3", optional = true }

[features]
# Not on by default: see `ureq` above for what enabling it costs.
fetch = ["dep:ureq", "dep:turox-engine"]

# Skipped entirely unless `fetch` is on, which is what keeps `cargo build
# --workspace` from building a TLS stack for a binary nobody is running.
[[bin]]
name = "generate-openings"
path = "src/bin/generate-openings.rs"
required-features = ["fetch"]
