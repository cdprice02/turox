[package]
name = "turox-cli"
version = "0.1.0"
edition = "2021"
# Matches turox-engine's floor (see its Cargo.toml), which this depends on.
rust-version = "1.87"

[lints]
workspace = true

[dependencies]
# Not `workspace.dependencies`: turox-engine takes zero runtime dependencies
# (see its Cargo.toml), so these are turox-cli's alone, not shared with
# anything else in the workspace. `clap` earns its place here for `--help`
# and `--version` alone; the UCI protocol itself arrives on stdin, so there
# are no flags to parse beyond those two.
clap = { version = "4.5.37", features = ["derive"] }
turox-engine = { path = "../turox-engine" }
