[package]
name = "turox-engine"
version = "0.1.0"
edition = "2021"
# 1.87 for u64::unbounded_shl/unbounded_shr (Bitboard::shl/shr).
rust-version = "1.87"

[lib]
name = "turox_engine"
path = "src/lib.rs"

[lints]
workspace = true

# Zero runtime dependencies, deliberately. See the "Dependency policy" section of
# docs/plans (or ask why): every candidate considered (anyhow, thiserror, smallvec,
# derive_more, bitflags) is either wrong-shaped for a hot-path engine or cheap enough
# to hand-write that pulling in a proc-macro crate isn't worth it. Keeps compile times
# down and the engine core close to no_std, which matters if a WASM build happens later.
[dependencies]

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "bitboard"
harness = false

[[bench]]
name = "fen"
harness = false

[[bench]]
name = "magic"
harness = false

[[bench]]
name = "move_gen"
harness = false

[[bench]]
name = "perft"
harness = false
