[package]
name = "turox-engine"
version = "0.1.0"
edition = "2021"
# 1.87 for u64::unbounded_shl/unbounded_shr (Bitboard::shl/shr).
rust-version = "1.87"

[lib]
name = "turox_engine"
path = "src/lib.rs"
# The lib has no benchmarks of its own, and without this `cargo bench` runs its
# libtest harness as one, which rejects criterion's flags.
bench = false

[lints]
workspace = true

# Zero *runtime* dependencies, deliberately: every third-party candidate
# considered (anyhow, thiserror, smallvec, derive_more, bitflags) is either
# wrong-shaped for a hot-path engine or cheap enough to hand-write that pulling
# one in isn't worth it. Keeps compile times down and the engine core close to
# no_std, which matters if a WASM build happens later.
#
# The three below are first-party and carry the same policy, so depending on
# them does not weaken it.
[dependencies]
turox-chess = { path = "../turox-chess" }
turox-macros = { path = "../turox-macros" }
turox-rng = { path = "../turox-rng" }

[dev-dependencies]
proptest = { workspace = true }
turox-chess = { path = "../turox-chess", features = ["strategies"] }
criterion = { workspace = true }

[[bench]]
name = "eval"
harness = false

[[bench]]
name = "search"
harness = false
